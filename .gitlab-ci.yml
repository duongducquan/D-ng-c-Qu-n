image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html public/
    - cp index-portfolio.html public/ || true
    - cp profile.html public/ || true
    - cp sitemap.xml public/ || true
    - cp google418125ccb6a667d9.html public/ || true
    - cp -r images public/ || true
    - cp -r hinhtngan public/ || true
  artifacts:
    paths:
      - public
  only:
    - main
