<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dương Đức Quân</title>
<meta name="description" content="Dương Đức Quân – DuongDucQuann">
<link rel="icon" type="image/png" href="logo.png">
<meta property="og:title" content="Dương Đức Quân – DuongDucQuann">
<meta property="og:description" content="Hồ sơ cá nhân của Dương Đức Quân">
<meta property="og:image" content="logo.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #eef2f7;
    --ink: #0f1c3f;
    --muted: #53627e;
    --fb-bg: #2b66ff;
    --btn-ghost-bg: #e5ebf4;
    --btn-border: #142145;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c142b;
      --ink: #eef2f7;
      --muted: #9aa7c4;
      --fb-bg: #3a72ff;
      --btn-ghost-bg: #182449;
      --btn-border: #ccd6ee;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 3.5rem 1.25rem 2.5rem;
    text-align: center;
  }

  .container {
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo-wrap {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: #ffffff;
    padding: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 24px -4px rgba(43, 102, 255, 0.25), 0 4px 10px rgba(15, 28, 63, 0.08);
    margin-bottom: 1.25rem;
    transition: transform 0.25s ease;
  }
  .logo-wrap:hover {
    transform: scale(1.06);
  }
  .logo {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.4rem, 6.5vw, 4rem);
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: -0.035em;
    color: var(--ink);
  }

  .role {
    margin: 0.65rem 0 0;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: -0.01em;
  }

  .links {
    margin: 1.75rem 0 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    justify-content: center;
    align-items: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.55rem 1.25rem;
    border-radius: 9999px;
    font-size: 0.88rem;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
    cursor: pointer;
    line-height: 1.2;
    white-space: nowrap;
  }
  .btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.05);
  }
  .btn:active {
    transform: translateY(0);
  }

  .btn-fb {
    background: var(--fb-bg);
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(43, 102, 255, 0.35);
  }

  .btn-ghost {
    background: var(--btn-ghost-bg);
    color: var(--ink);
    box-shadow: inset 0 0 0 1.5px var(--btn-border);
  }

  .btn-icon {
    font-size: 0.95rem;
    display: inline-block;
    line-height: 1;
  }

  .gallery {
    margin: 2.75rem 0 0;
    width: 100%;
    max-width: 820px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 0.75rem;
  }

  @media (max-width: 768px) {
    .gallery {
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
    }
  }

  @media (max-width: 480px) {
    .gallery {
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }
    body {
      padding: 2.25rem 1rem 2rem;
    }
  }

  .gallery-item {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.05);
    box-shadow: 0 4px 12px rgba(15, 28, 63, 0.08);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
  }
  .gallery-item:hover {
    transform: scale(1.04);
    box-shadow: 0 10px 22px rgba(15, 28, 63, 0.16);
    z-index: 2;
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  footer {
    margin-top: 3.5rem;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 500;
  }
</style>
</head>
