<!DOCTYPE html>
<html lang="vi">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dương Đức Quân</title>

<link rel="icon" type="image/png" href="logo.png">
<meta property="og:title" content="Dương Đức Quân – DuongDucQuann">
<meta property="og:description" content="Hồ sơ cá nhân của Dương Đức Quân">
<meta property="og:image" content="https://duongducquannn.vercel.app/logo.png">
<meta property="og:url" content="https://duongducquannn.vercel.app">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #eef1f6;
    --ink: #0f1b3d;
    --muted: #4b5876;
    --accent: #2f5bff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1330;
      --ink: #eef1f6;
      --muted: #a6b0cc;
      --accent: #7d9bff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
  }
  .logo {
    width: 96px; height: 96px; border-radius: 50%;
    object-fit: cover; box-shadow: 0 4px 16px rgba(0,0,0,.25);
    margin-bottom: 1rem;
  }
  h1 {
    margin: 0;
    font-weight: 800;
    font-size: clamp(2.5rem, 10vw, 5rem);
    line-height: 1;
    letter-spacing: -0.03em;
  }
  .role { margin: 1rem 0 0; color: var(--muted); font-weight: 600; }
  .links { margin: 2rem 0 0; display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
  .btn {
    display: inline-block;
    padding: 0.75rem 1.4rem;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    text-decoration: none;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .gallery {
    margin: 2.5rem 0 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.75rem;
    max-width: 900px;
  }
  .gallery img {
    width: 100%; aspect-ratio: 1; object-fit: cover;
    border-radius: 12px; display: block;
    transition: transform .2s;
  }
  .gallery img:hover { transform: scale(1.05); }
  footer { margin-top: 3rem; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Logo Dương Đức Quân">
  <h1>Dương Đức Quân</h1>
  <p class="role">DuongDucQuann</p>
  <p class="links">
    <a class="btn" href="https://www.facebook.com/DuongDucQuann" target="_blank" rel="noopener">📘 Facebook</a>
    <a class="btn ghost" href="https://www.tiktok.com/@duongducquan285" target="_blank" rel="noopener">🎵 TikTok</a>
    <a class="btn ghost" href="https://github.com/duongducquan" target="_blank" rel="noopener">GitHub</a>
    <a class="btn ghost" href="https://www.linkedin.com/in/duongducquan" target="_blank" rel="noopener">LinkedIn</a>
  </p>
</main>
